<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactieve Galerij</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="app.js"></script>
</head>
<body>
<a-scene>
    <a-sky color="#87CEEB"></a-sky>

    <a-entity camera look-controls>
        <a-entity cursor="rayOrigin: mouse;" position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: black; shader: flat">
        </a-entity>
    </a-entity>

    <a-text value="Klik op de vormen!" position="-1.2 2.5 -4" color="#FFFFFF"></a-text>

    <a-box position="-2 1 -4" color="blue" interactief-object></a-box>
    <a-sphere position="0 1 -4" color="red" interactief-object></a-sphere>
    <a-cylinder position="2 1 -4" color="green" interactief-object></a-cylinder>
</a-scene>
</body>
</html>
